<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olatade Obasan | Orbital Portfolio</title>

      name="description"
      content="An orbital portfolio for software engineer Olatade Obasan, with projects, games, resume, and contact arranged as a cinematic solar system."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"

        <p>Choose a planet to travel deeper into the work.</p>

      <canvas id="solar-canvas" aria-label="Interactive 3D solar system portfolio"></canvas>

      <aside class="planet-legend" aria-label="Destinations">
        <a href="./projects.html" data-focus-planet="projects">Projects</a>
        <a href="./games.html" data-focus-planet="games">Games</a>
        <a href="./resume.html" data-focus-planet="resume">About</a>

    <script src="./script.js"></script>
    <script type="module" src="./solar-system.js"></script>
